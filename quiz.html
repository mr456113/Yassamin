<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آزمون‌خونه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:#5a4a6a;background:linear-gradient(160deg,#ffe3f1,#e9ddff 50%,#d9f0ff);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.ttl{font-weight:800;font-size:20px}
.back{color:#b06ab3;text-decoration:none;font-size:14px}
nav{display:flex;gap:6px;padding:0 10px;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:0;border-radius:16px;padding:10px 12px;background:#ffffffaa;font:inherit;color:inherit;cursor:pointer}
nav button.on{background:#ff9ec4;color:#fff;font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:16px 4px 8px}
.card{background:#ffffffcc;border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 4px 14px #c9a8e633}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sub{background:#fff;border-radius:20px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 4px 12px #c9a8e633;display:flex;flex-direction:column;gap:4px}
.sub .em{font-size:34px}
small{opacity:.7}
.btn{border:0;border-radius:14px;padding:10px 16px;background:#ff9ec4;color:#fff;font:inherit;cursor:pointer}
.btn.ghost{background:#e6d9ff;color:#6b4f8a}
.btn.sm{padding:6px 10px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:12px;margin:8px 0;flex-wrap:wrap}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;padding:10px;border:2px solid #f0d9f5;border-radius:12px;margin:4px 0 8px;background:#fff;color:inherit}
label{font-size:13px;opacity:.8}
.modal{position:fixed;inset:0;background:#4b2f6a66;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .box{background:#fff9fd;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
.row{display:flex;gap:8px;margin-top:8px}
.login{max-width:340px;margin:12vh auto;background:#ffffffcc;border-radius:26px;padding:24px;text-align:center}
.em2{font-size:60px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#6b4f8a;color:#fff;padding:10px 18px;border-radius:20px;transition:.3s;z-index:99;opacity:0}
#toast.show{transform:translateX(-50%);opacity:1}
code{font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
<script src="q1.js?v=1"></script>
<script src="q2.js?v=1"></script>
<script src="q3.js?v=1"></script>
</body>
</html>
