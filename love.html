<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخملی بابایی 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Vazirmatn,sans-serif;background:linear-gradient(160deg,#ffe3ee,#e8e0ff 60%,#dff3ff);color:#4a3a4a;min-height:100vh}
body.dk{background:#1d1a2b;color:#eee}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.c{background:#fff;border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0001}
body.dk .c{background:#2a2640}
.b{border:0;border-radius:14px;padding:10px 14px;background:#ffd1e3;font-family:inherit;font-size:15px;cursor:pointer;color:#4a3a4a}
.b.on,.b.p{background:#ff8fb8;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.em button{font-size:30px;background:#fff5;border:2px solid transparent;border-radius:16px;padding:6px 10px;cursor:pointer}
.em button.on{border-color:#ff6fa5;background:#ffe3ee}
input,textarea{font-family:inherit;font-size:15px;padding:10px;border-radius:12px;border:1px solid #ddd;width:100%;box-sizing:border-box;margin:4px 0}
.s{font-size:12px;opacity:.7}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="c">⏳ در حال باز شدن...</div></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
<script src="love1.js?v=1"></script>
<script src="love2.js?v=1"></script>
</body>
</html>
